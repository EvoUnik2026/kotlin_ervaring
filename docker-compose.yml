services:
  app-postgres:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kotlin-app-postgres
    profiles: ["postgres"]
    ports:
      - "8080:8080"
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-app_db}
      DB_USERNAME: ${DB_USERNAME:-app_user}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      LOG_LEVEL_ROOT: ${LOG_LEVEL_ROOT:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - web
    restart: unless-stopped

  app-mariadb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kotlin-app-mariadb
    profiles: ["mariadb"]
    ports:
      - "8080:8080"
    environment:
      DB_HOST: ${DB_HOST:-mariadb}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-app_db}
      DB_USERNAME: ${DB_USERNAME:-app_user}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      LOG_LEVEL_ROOT: ${LOG_LEVEL_ROOT:-INFO}
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - web
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: kotlin-postgres
    profiles: ["postgres"]
    environment:
      POSTGRES_DB: ${DB_NAME:-app_db}
      POSTGRES_USER: ${DB_USERNAME:-app_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - web
    restart: unless-stopped

  mariadb:
    image: mariadb:11
    container_name: kotlin-mariadb
    profiles: ["mariadb"]
    environment:
      MARIADB_DATABASE: ${DB_NAME:-app_db}
      MARIADB_USER: ${DB_USERNAME:-app_user}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?MARIADB_ROOT_PASSWORD must be set}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - web
    restart: unless-stopped

  adminer:
    image: adminer:4
    container_name: kotlin-adminer
    profiles: ["postgres", "mariadb"]
    ports:
      - "8081:8080"
    networks:
      - web
    restart: unless-stopped

  loki:
    image: grafana/loki:3.0.0
    container_name: kotlin-loki
    profiles: ["postgres", "mariadb"]
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    networks:
      - web
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.0.0
    container_name: kotlin-promtail
    profiles: ["postgres", "mariadb"]
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./ops/promtail-config.yml:/etc/promtail/config.yml:ro
    depends_on:
      - loki
    networks:
      - web
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    container_name: kotlin-grafana
    profiles: ["postgres", "mariadb"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?GF_SECURITY_ADMIN_PASSWORD must be set}
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - loki
    networks:
      - web
    restart: unless-stopped

volumes:
  postgres_data:
  mariadb_data:
  grafana_data:

networks:
  web:
    driver: bridge
